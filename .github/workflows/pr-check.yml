name: PR and Portfolio Demo Checks

on:
  push:
    branches:
      - portfolio-demo
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Restore backend dependencies
        run: dotnet restore ./Backend/SellPoint.API/SellPoint.API.csproj

      - name: Build backend
        run: dotnet build ./Backend/SellPoint.API/SellPoint.API.csproj --configuration Release --no-restore

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: Frontend/sellpoint-react/package-lock.json

      - name: Install frontend dependencies
        working-directory: Frontend/sellpoint-react
        run: npm ci

      - name: Run frontend tests
        working-directory: Frontend/sellpoint-react
        env:
          REACT_APP_DATA_MODE: demo
        run: npm test -- --watchAll=false --runInBand

      - name: Build frontend
        working-directory: Frontend/sellpoint-react
        env:
          REACT_APP_DATA_MODE: demo
          DISABLE_ESLINT_PLUGIN: 'true'
        run: npm run build
