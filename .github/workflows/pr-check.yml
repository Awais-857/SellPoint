name: PR Build Check

on:
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Restore dependencies
        run: dotnet restore ./Backend/SellPoint.API/SellPoint.API.csproj

      - name: Build
        run: dotnet build ./Backend/SellPoint.API/SellPoint.API.csproj --configuration Release --no-restore
